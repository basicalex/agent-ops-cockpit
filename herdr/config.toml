onboarding = false

# AOC-derived Alt-key UX for Herdr.
# Keep Herdr as the multiplexer/control surface; these port the AOC muscle memory.
[keys]
prefix = "ctrl+b"
help = "alt+?"
settings = "alt+c"
detach = "prefix+q"
reload_config = "prefix+r"
open_notification_target = "prefix+o"

# Workspaces/navigation.
goto = "alt+x"
workspace_picker = "alt+w"
new_workspace = "alt+shift+n"
new_worktree = "prefix+shift+g"
rename_workspace = "prefix+shift+r"
close_workspace = "alt+shift+q"
previous_workspace = "alt+k"
next_workspace = "alt+j"
navigate_workspace_up = "k"
navigate_workspace_down = "j"

# AOC-style tab flow.
new_tab = "alt+n"
rename_tab = "alt+shift+r"
previous_tab = "alt+i"
next_tab = "alt+o"
# Reorder the active tab in place (Herdr 0.8.2+); Cmd+Shift+U / Cmd+Shift+P in Ghostty.
move_tab_previous = "alt+shift+u"
move_tab_next = "alt+shift+p"
switch_tab = "alt+1..9"
# Agent attention queue: alt+a jumps to the next sidebar agent (Cmd+A in Ghostty).
# With agent_panel_sort = "priority" the walk starts at blocked/done agents.
next_agent = "alt+a"
previous_agent = "alt+shift+a"
close_tab = "alt+shift+x"
# Direct pane navigation.
focus_pane_left = "alt+h"
focus_pane_down = "alt+shift+j"
focus_pane_up = "alt+shift+k"
focus_pane_right = "alt+l"
navigate_pane_left = ""
navigate_pane_down = ""
navigate_pane_up = ""
navigate_pane_right = ""
cycle_pane_next = ""
cycle_pane_previous = "prefix+shift+tab"
last_pane = "alt+tab"
rename_pane = "alt+r"
close_pane = "alt+shift+w"
# Swap the focused pane with its left/right neighbour; Cmd+Shift+I / Cmd+Shift+O in Ghostty.
# Up/down swaps stay on the default prefix+shift+k / prefix+shift+j.
swap_pane_left = "alt+shift+i"
swap_pane_right = "alt+shift+o"

# Pane/layout actions.
split_vertical = "alt+v"
split_horizontal = "alt+minus"
zoom = "alt+z"
resize_mode = "prefix+shift+z"
toggle_sidebar = "alt+b"
edit_scrollback = "prefix+e"


[ui]
show_agent_labels_on_pane_borders = false

agent_panel_sort = "priority"
[ui.toast]
delivery = "terminal"

[experimental]
kitty_graphics = true
pane_history = false

[ui.sound]
enabled = true

[theme]
name = "terminal"
