<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFAF0"/>

  <!-- header: eyebrow + title + hairline. Bounds x y w h must contain every glyph. -->
  <g id="header" data-pptx-bounds="72 68 1136 112">
    <text x="72" y="84" font-size="13" font-weight="bold" letter-spacing="2.3" fill="#1A7F7C">EYEBROW · TOPIC</text>
    <text x="72" y="142" font-family="Georgia" font-size="44" fill="#0F1B2B">Title in one sentence.</text>
    <line x1="72" y1="176" x2="1208" y2="176" stroke="#0F1B2B" stroke-opacity="0.12" stroke-width="1"/>
  </g>

  <!-- body column: wrap with tspan x=<same x> dy=28; grow the bounds when adding lines -->
  <g id="body" data-pptx-bounds="72 222 536 200">
    <text x="72" y="270" font-family="Georgia" font-size="26" fill="#0F1B2B">Section line.</text>
    <text x="72" y="308" font-size="20" fill="#0F1B2B" fill-opacity="0.72">First body line that wraps<tspan x="72" dy="28">onto a second line.</tspan></text>
  </g>

  <!-- screenshot frame: clip, hairline stroke, soft shadow. Image keeps its ratio; crop by shifting inside the clip. -->
  <defs>
    <clipPath id="shot-1"><rect x="672" y="214" width="536" height="335" rx="16"/></clipPath>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F1B2B" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g id="shot" data-pptx-bounds="672 214 536 335">
    <rect x="672" y="214" width="536" height="335" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
    <image href="../images/REPLACE.png" x="672" y="214" width="536" height="335" preserveAspectRatio="xMidYMin slice" clip-path="url(#shot-1)"/>
    <rect x="672" y="214" width="536" height="335" rx="16" fill="none" stroke="#0F1B2B" stroke-opacity="0.12" stroke-width="1"/>
  </g>

  <g id="chrome" data-pptx-role="footer" data-pptx-bounds="72 674 1136 18">
    <text x="72" y="686" font-size="13" fill="#0F1B2B" fill-opacity="0.45">Deck short name</text>
    <text x="1208" y="686" font-size="13" text-anchor="end" fill="#0F1B2B" fill-opacity="0.45">02 / 18</text>
  </g>
</svg>
